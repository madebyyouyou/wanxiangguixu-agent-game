<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>渡厄镇 · 万象归墟</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/phase2.css" />
</head>
<body>
  <!-- 液态玻璃折射滤镜：被 CSS 里 backdrop-filter:url(#lqGlass/#lqGlassLg) 引用。
       仅 Chromium 系支持 backdrop 的 url() 滤镜 → 出折射；Safari/Firefox 不支持时 @supports 自动跳过、退回强毛玻璃。 -->
  <svg id="lq-glass-defs" width="0" height="0" aria-hidden="true" focusable="false"
       style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;">
    <filter id="lqGlass" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.019" numOctaves="2" seed="11" result="n"/>
      <feGaussianBlur in="n" stdDeviation="1.2" result="nb"/>
      <feDisplacementMap in="SourceGraphic" in2="nb" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lqGlassLg" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="11" result="n"/>
      <feGaussianBlur in="n" stdDeviation="1.6" result="nb"/>
      <feDisplacementMap in="SourceGraphic" in2="nb" scale="40" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <!-- 16:9 舞台，所有场景挂载于此 -->
  <div id="stage">
    <div id="app"></div>
    <!-- 场景过场遮罩 -->
    <div id="fx-overlay"></div>
    <!-- 全局轻提示（线索收录、清醒值变化等） -->
    <div id="toast-layer"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
